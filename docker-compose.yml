# 一行全部跑起來：docker compose up -d --build → http://localhost:8009
#   db / redis / minio：基礎設施
#   migrate：建立資料表（＋範例資料），跑完就結束
#   api：FastAPI，同時提供前端
#   worker：背景工作（解析、出題、TTS、轉錄、評分、報告、排程）
# 要用 OpenAI／Google 登入：在 backend/.env 填金鑰（沒有這個檔也能跑，會用開發模式）。
# 只想在本機跑 Python、容器只放基礎設施：docker compose up -d db redis minio（見 README.md）。

x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: ai-interview-app
  env_file:
    - path: backend/.env
      required: false
  environment: &app-env
    # 容器內用服務名稱連線；預簽名網址是給瀏覽器用的，所以公開位址維持 localhost
    DATABASE_URL: postgresql://ai:ai@db:5432/ai_interview
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://minio:9000
    S3_PUBLIC_ENDPOINT: http://localhost:9100
    S3_ACCESS_KEY: minioadmin
    S3_SECRET_KEY: minioadmin
    S3_BUCKET: ai-interview
    BASE_URL: http://localhost:8009
    FRONTEND_DIR: /frontend
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai_interview
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai_interview"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6381:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9100:9000", "9101:9001"]
    volumes: [miniodata:/data]
    restart: unless-stopped

  migrate:
    <<: *app
    restart: "no"
    environment:
      <<: *app-env
      SEED_DEMO: ${SEED_DEMO:-true}
    command: ["sh", "-c", "python -m app.core.migrate && if [ \"$${SEED_DEMO:-true}\" = \"true\" ]; then python -m app.seed --admin demo@example.com; fi"]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *app
    ports: ["8009:8009"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    <<: *app
    command: ["python", "-m", "app.workers.main"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  miniodata:
