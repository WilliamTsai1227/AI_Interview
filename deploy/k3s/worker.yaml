# 背景工作分成兩個 Deployment，對應 app/workers/main.py 的兩條佇列，可以各自擴充：
#   worker-interactive：面試中的工作（TTS、轉錄、評分），使用者在等，要快
#   worker-default：解析、出題、報告、職涯規劃，以及排程（cron）。排程只在這裡跑，所以維持 1 個 Pod
# 平滑關閉（app/workers/main.py）：收到 SIGTERM 後不再接新工作，等進行中的工作做完（最多 job_timeout：
# interactive 300 秒、default 600 秒），還沒做完的交還給新的 Pod。terminationGracePeriodSeconds 要比這個長。
# 滾動更新先開新的 Pod（maxSurge 1、maxUnavailable 0），舊的在背景把工作做完，佇列不會停下來。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-interactive
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: worker, queue: interactive }
  template:
    metadata:
      labels: { app: worker, queue: interactive }
    spec:
      terminationGracePeriodSeconds: 330    # job_timeout 300 秒＋收尾
      initContainers:
        - name: wait-for-deps           # 資料庫和 Redis 可以連線才啟動（同 api.yaml）
          image: redis:7-alpine
          command: ["sh", "-c", "until nc -z db 5432 && redis-cli -h redis ping; do sleep 2; done"]
      containers:
        - name: worker
          image: ai-interview-app:dev   # deploy.sh 會換成這次 build 的 tag
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.main", "interactive"]
          envFrom:
            - secretRef: { name: app-secrets, optional: true }
            - configMapRef: { name: app-config }
            - secretRef: { name: infra-credentials }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-default
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: worker, queue: default }
  template:
    metadata:
      labels: { app: worker, queue: default }
    spec:
      terminationGracePeriodSeconds: 630    # job_timeout 600 秒＋收尾
      initContainers:
        - name: wait-for-deps           # 資料庫和 Redis 可以連線才啟動（同 api.yaml）
          image: redis:7-alpine
          command: ["sh", "-c", "until nc -z db 5432 && redis-cli -h redis ping; do sleep 2; done"]
      containers:
        - name: worker
          image: ai-interview-app:dev   # deploy.sh 會換成這次 build 的 tag
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.main", "default"]
          envFrom:
            - secretRef: { name: app-secrets, optional: true }
            - configMapRef: { name: app-config }
            - secretRef: { name: infra-credentials }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
