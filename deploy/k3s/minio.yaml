# MinIO：叢集內的 api／worker 用 minio:9000；瀏覽器用 minio-public（LoadBalancer）的 9100，跟 docker compose 相同
# bucket 由 api 啟動時自動建立
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: { app: minio }
  ports:
    - port: 9000
---
# k3s 內建的 ServiceLB 會在節點上開 9100 埠，Lima 再把它轉到 Mac 的 localhost:9100
apiVersion: v1
kind: Service
metadata:
  name: minio-public
spec:
  type: LoadBalancer
  selector: { app: minio }
  ports:
    - port: 9100
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]   # 用 args 才會保留 image 的 entrypoint（minio）
          envFrom:
            - secretRef: { name: infra-credentials }
          ports:
            - containerPort: 9000
            - containerPort: 9001
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
