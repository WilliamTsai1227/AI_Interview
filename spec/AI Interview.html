<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI Interview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: app shell — left rail of rounded nav, roomy main column of soft cards; collapses to a top bar + scrollable nav chips on phones */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EDF1F6; --line:#DFE4EC;
  --ink:#131B2E; --ink-2:#4F5B70; --ink-3:#8590A3;
  --leaf:#1E4D8C; --leaf-ink:#FFFFFF; --leaf-soft:#E4ECF7;
  --sun:#E8A33A; --sun-soft:#FBF0DC; --sun-ink:#7A4E07;
  --peach:#F07A5A; --peach-soft:#FDE7E0; --peach-ink:#A23D21;
  --sky:#2F86C9; --sky-soft:#E0EEF8;
  --good:#1F8A5B; --warn:#B97A0C; --bad:#CF4B32;
  --hero:#14284B; --hero-2:#1E4D8C; --hero-ink:#FFFFFF; --hero-ink-2:#C5D3E8;
  --shadow:0 1px 2px rgba(19,27,46,.05),0 4px 16px rgba(19,27,46,.05);
  --f-display:"Plus Jakarta Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Plus Jakarta Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Plus Jakarta Sans","Noto Sans TC",system-ui,sans-serif;
  --r-lg:16px; --r-md:12px; --r-sm:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#151D2C; --surface-2:#1C2638; --line:#28344A;
  --ink:#E6ECF5; --ink-2:#A3AFC2; --ink-3:#717E94;
  --leaf:#7BA7E8; --leaf-ink:#0B1626; --leaf-soft:#1C2D4A;
  --sun:#F0B85A; --sun-soft:#382B16; --sun-ink:#F5D08E;
  --peach:#FF9677; --peach-soft:#3A2420; --peach-ink:#FFBFA9;
  --sky:#6CB2EA; --sky-soft:#17304A;
  --good:#5CC796; --warn:#E5B04A; --bad:#F27A62;
  --hero:#16243F; --hero-2:#1F3A66; --hero-ink:#FFFFFF; --hero-ink-2:#B4C3DB;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#151D2C; --surface-2:#1C2638; --line:#28344A;
  --ink:#E6ECF5; --ink-2:#A3AFC2; --ink-3:#717E94;
  --leaf:#7BA7E8; --leaf-ink:#0B1626; --leaf-soft:#1C2D4A;
  --sun:#F0B85A; --sun-soft:#382B16; --sun-ink:#F5D08E;
  --peach:#FF9677; --peach-soft:#3A2420; --peach-ink:#FFBFA9;
  --sky:#6CB2EA; --sky-soft:#17304A;
  --good:#5CC796; --warn:#E5B04A; --bad:#F27A62;
  --hero:#16243F; --hero-2:#1F3A66; --hero-ink:#FFFFFF; --hero-ink-2:#B4C3DB;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:clamp(1.6rem,1.2rem + 1.4vw,2.2rem)}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:24px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.12rem;letter-spacing:-.01em;display:block;line-height:1.2}
.brand small{display:block;color:var(--ink-3);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500;transition:background .15s,color .15s}
.nav a svg{width:20px;height:20px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--leaf-soft);color:var(--leaf)}
.nav .sep{font-size:.68rem;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:14px 14px 4px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.mini-me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--surface-2)}
.mini-me .av{width:36px;height:36px;font-size:.95rem}
.mini-me div{line-height:1.3;font-size:.85rem}
.mini-me small{color:var(--ink-3)}
.theme-btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:.85rem;color:var(--ink-2);display:flex;align-items:center;gap:8px;justify-content:center}

main{padding-block:32px 64px;padding-inline:clamp(16px,4vw,48px);min-width:0}
.page{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:24px;animation:rise .35s ease both}
@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.head p{color:var(--ink-2);margin-top:6px}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf);font-weight:700}

/* atoms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card h3{margin-bottom:12px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 340px}
.g-side-l{grid-template-columns:360px minmax(0,1fr)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3);font-size:.85rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:.92rem;text-decoration:none;transition:transform .12s,box-shadow .12s,background .15s;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn:active{transform:scale(.97)}
.btn-pri{background:var(--leaf);color:var(--leaf-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--leaf) 30%,transparent)}
.btn-pri:hover{box-shadow:0 6px 20px color-mix(in srgb,var(--leaf) 40%,transparent)}
.btn-sun{background:var(--sun);color:#2E1F04}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-soft{background:var(--leaf-soft);color:var(--leaf)}
.btn-sm{padding:7px 14px;font-size:.85rem}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.8rem;font-weight:500;background:var(--surface-2);color:var(--ink-2);border:1px solid transparent}
.chip.leaf{background:var(--leaf-soft);color:var(--leaf)}
.chip.sun{background:var(--sun-soft);color:var(--sun-ink)}
.chip.peach{background:var(--peach-soft);color:var(--peach-ink)}
.chip.sky{background:var(--sky-soft);color:var(--sky)}
.chip.out{background:transparent;border-color:var(--line)}
button.chip{cursor:pointer}
button.chip.sel{background:var(--leaf);color:var(--leaf-ink)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.82rem;font-weight:700;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;padding:10px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);outline:none;transition:border .15s,box-shadow .15s}
.input:focus{border-color:var(--leaf);box-shadow:0 0 0 4px var(--leaf-soft)}
textarea.input{resize:vertical;min-height:96px;line-height:1.6}

.av{border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#fff;background:linear-gradient(135deg,var(--peach),var(--sun));flex:none}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--leaf)}

/* mascot */
.mascot{position:relative;flex:none}
.mascot svg{width:100%;height:100%;overflow:visible}
.mascot .eye{animation:blink 4.5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mascot .mouth-o{display:none}.mascot.talk .mouth-o{display:inline}.mascot.talk .smile{display:none}
.mascot.talk .mouth-o{animation:talk .32s infinite alternate;transform-origin:center;transform-box:fill-box}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.1)}}
.mascot .glint{animation:glint 6s ease-in-out infinite}
@keyframes glint{0%,100%{opacity:.25}50%{opacity:.45}}
.logo{width:36px;height:36px;flex:none}

/* home */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;background:radial-gradient(60% 120% at 100% 0%,color-mix(in srgb,var(--sun) 30%,transparent),transparent 60%),linear-gradient(120deg,var(--hero),var(--hero-2));color:var(--hero-ink);border-radius:20px;padding:30px 34px}
.hero .eyebrow{color:var(--sun)}
.hero .btn-ghost{background:rgba(255,255,255,.1);color:var(--hero-ink);border-color:rgba(255,255,255,.25)}
.hero .btn-ghost:hover{background:rgba(255,255,255,.18)}
.hero .btn-pri{background:var(--sun);color:#2E1F04;box-shadow:none}
.hero .mascot{width:132px;height:132px}
.hero p{color:var(--hero-ink-2);margin:8px 0 18px;max-width:52ch}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-num);font-weight:800;font-size:2rem;line-height:1.1}
.stat .v small{font-size:.9rem;color:var(--ink-3);font-weight:600;margin-left:2px}
.stat .k{color:var(--ink-2);font-size:.85rem}
.streak{display:flex;gap:6px;margin-top:10px}
.streak span{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:.7rem;color:var(--ink-3)}
.streak span.on{background:var(--leaf);color:var(--leaf-ink);font-weight:700}
.list-item{display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;text-decoration:none;color:inherit;transition:background .15s}
.list-item:hover{background:var(--surface-2)}
.score-pill{font-family:var(--f-num);font-weight:800;min-width:48px;text-align:center;padding:4px 10px;border-radius:12px}
.s-good{background:var(--leaf-soft);color:var(--good)}
.s-mid{background:var(--sun-soft);color:var(--sun-ink)}
.s-low{background:var(--peach-soft);color:var(--peach-ink)}
.co-logo{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.05rem;flex:none}
.tip{display:flex;gap:14px;align-items:flex-start;background:var(--sky-soft);border-radius:var(--r-lg);padding:18px 20px}
.tip svg{width:22px;height:22px;color:var(--sky);flex:none;margin-top:2px}

/* interview */
.iv{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px}
.stage{position:relative;border-radius:20px;padding:28px;min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:20px;background:radial-gradient(120% 80% at 50% 0%,var(--leaf-soft),var(--surface) 70%);border:1px solid var(--line);overflow:hidden}
.stage-top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rec{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;color:var(--bad);background:var(--surface);padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.halo{position:relative;width:200px;height:200px;display:grid;place-items:center}
.halo::before,.halo::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--leaf);opacity:0}
.halo.speaking::before{animation:ring 1.8s ease-out infinite}
.halo.speaking::after{animation:ring 1.8s .6s ease-out infinite}
@keyframes ring{from{transform:scale(.7);opacity:.22}to{transform:scale(1.35);opacity:0}}
.halo .mascot{width:170px;height:170px;z-index:1}
.q-bubble{max-width:560px;text-align:center}
.q-bubble .who{font-size:.8rem;color:var(--leaf);font-weight:700;letter-spacing:.06em}
.q-bubble p{font-family:var(--f-display);font-weight:600;font-size:1.25rem;line-height:1.55;margin-top:6px;min-height:2.6em}
.controls{display:flex;align-items:center;gap:18px}
.mic{width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--leaf);color:var(--leaf-ink);box-shadow:0 8px 24px color-mix(in srgb,var(--leaf) 35%,transparent);transition:transform .15s,background .2s}
.mic svg{width:30px;height:30px}
.mic:hover{transform:scale(1.05)}
.mic.live{background:var(--peach);box-shadow:0 0 0 10px var(--peach-soft),0 8px 24px color-mix(in srgb,var(--peach) 40%,transparent)}
.mic:disabled{opacity:.5;cursor:not-allowed;transform:none}
.wave{display:flex;align-items:center;gap:4px;height:36px}
.wave i{width:4px;border-radius:4px;background:var(--ink-3);height:6px;transition:height .1s}
.wave.live i{background:var(--peach);animation:wv .9s ease-in-out infinite}
.wave.live i:nth-child(2n){animation-delay:.15s}.wave.live i:nth-child(3n){animation-delay:.3s}.wave.live i:nth-child(5n){animation-delay:.45s}
@keyframes wv{0%,100%{height:6px}50%{height:32px}}
.mic-hint{font-size:.85rem;color:var(--ink-2);text-align:center;min-height:1.4em}
.tr{display:flex;flex-direction:column;height:100%;max-height:640px}
.tr-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px;min-height:260px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .b{padding:10px 14px;border-radius:16px;font-size:.92rem;line-height:1.6;max-width:85%}
.msg.ai .b{background:var(--surface-2);border-top-left-radius:4px}
.msg.me{flex-direction:row-reverse}
.msg.me .b{background:var(--leaf-soft);border-top-right-radius:4px}
.msg .tag{font-size:.72rem;color:var(--ink-3);margin-bottom:2px}
.msg .mini{width:30px;height:30px;flex:none}
.typing::after{content:"▍";animation:pulse 1s infinite;color:var(--leaf)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--surface-2)}
.steps i.done{background:var(--leaf)}
.steps i.cur{background:var(--sun)}
.setup-opt{display:flex;gap:12px;align-items:center;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.setup-opt.sel{border-color:var(--leaf);background:var(--leaf-soft)}
.setup-opt b{display:block}

/* profile */
.dropzone{border:2px dashed var(--line);border-radius:var(--r-lg);padding:28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface-2);transition:border .15s,background .15s;cursor:pointer}
.dropzone.over{border-color:var(--leaf);background:var(--leaf-soft)}
.dropzone svg{width:40px;height:40px;color:var(--leaf)}
.file-row{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.file-ico{width:44px;height:52px;border-radius:8px;background:var(--peach-soft);color:var(--peach-ink);display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:.72rem;flex:none}
.timeline{display:flex;flex-direction:column;gap:0;position:relative}
.tl{display:grid;grid-template-columns:18px minmax(0,1fr);gap:14px;padding-bottom:18px;position:relative}
.tl::before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl .dot{width:18px;height:18px;border-radius:50%;border:4px solid var(--leaf-soft);background:var(--leaf);margin-top:3px}
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;text-align:center;line-height:1.1}
.ring .c b{font-family:var(--f-num);font-weight:800;display:block}

/* jobs */
.search{display:flex;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.search .input{border:0;box-shadow:none;flex:1 1 220px;min-width:0}
.search .input:focus{box-shadow:none}
.search select.input{flex:0 1 160px;background:var(--surface-2)}
.job{display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .15s,transform .15s;text-align:left;width:100%}
.job:hover{transform:translateY(-2px)}
.job.sel{border-color:var(--leaf);box-shadow:0 0 0 3px var(--leaf-soft)}
.match{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-num);font-weight:800;font-size:.85rem;padding:4px 10px;border-radius:999px;background:var(--leaf-soft);color:var(--good)}
.match.mid{background:var(--sun-soft);color:var(--sun-ink)}
.jd{position:sticky;top:24px}
.jd ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--ink-2)}

/* questions */
.qcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:flex-start;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);transition:box-shadow .15s}
.qcard:hover{box-shadow:var(--shadow)}
.qno{width:32px;height:32px;border-radius:10px;background:var(--leaf-soft);color:var(--leaf);display:grid;place-items:center;font-family:var(--f-num);font-weight:800}
.qtext{font-weight:500;line-height:1.6}
.qacts{display:flex;gap:6px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-size:.88rem;color:var(--ink-2);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.range-row{display:flex;align-items:center;gap:12px}
.range-row input{flex:1;accent-color:var(--leaf)}
.gen-shimmer{height:72px;border-radius:18px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shim 1.2s infinite}
@keyframes shim{to{background-position:-200% 0}}

/* prep */
.prob{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:6px 14px;align-items:center}
.prob .bar{height:10px}
.prob .p{font-family:var(--f-num);font-weight:800;text-align:right}
.lq{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.lq summary{list-style:none;display:flex;gap:12px;align-items:flex-start;padding:16px 18px;cursor:pointer}
.lq summary::-webkit-details-marker{display:none}
.lq summary .chev{margin-left:auto;transition:transform .2s;color:var(--ink-3);flex:none}
.lq[open] summary .chev{transform:rotate(180deg)}
.lq .in{padding:0 18px 18px 62px;display:flex;flex-direction:column;gap:10px}
.lq .in h4{font-family:var(--f-body);font-weight:700;font-size:.82rem;color:var(--ink-2)}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;accent-color:var(--leaf);margin-top:2px;flex:none}
.check input:checked+span{text-decoration:line-through;color:var(--ink-3)}
.sw{display:flex;gap:10px;align-items:flex-start}
.sw svg{width:18px;height:18px;flex:none;margin-top:3px}

/* report */
.rep-hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:28px;align-items:center}
.dims{display:flex;flex-direction:column;gap:14px}
.dim{display:grid;grid-template-columns:88px minmax(0,1fr) 40px;gap:12px;align-items:center;font-size:.9rem}
.dim .bar{height:10px}
.dim b{font-family:var(--f-num);text-align:right}
.qa{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.qa>summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:18px 20px;cursor:pointer}
.qa>summary::-webkit-details-marker{display:none}
.qa .chev{transition:transform .2s;color:var(--ink-3)}
.qa[open] .chev{transform:rotate(180deg)}
.qa-body{padding:0 20px 22px;display:grid;gap:14px}
.blk{border-radius:16px;padding:14px 16px}
.blk h4{font-family:var(--f-body);font-size:.8rem;font-weight:700;letter-spacing:.06em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.blk h4 svg{width:15px;height:15px}
.blk.q{background:var(--surface-2)}
.blk.a{background:var(--surface);border:1px solid var(--line)}
.blk.a p{color:var(--ink-2)}
.blk.good{background:var(--leaf-soft)} .blk.good h4{color:var(--good)}
.blk.fix{background:var(--sun-soft)} .blk.fix h4{color:var(--sun-ink)}
.blk.better{background:var(--sky-soft)} .blk.better h4{color:var(--sky)}
.blk ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.hl{background:color-mix(in srgb,var(--sun) 35%,transparent);border-radius:4px;padding:0 2px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* topbar for phones */
.topbar{display:none}
@media (max-width:1080px){
  .g-side,.iv,.g-side-l{grid-template-columns:minmax(0,1fr)}
  .jd{position:static}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .topbar{display:flex;flex-direction:column;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px 10px}
  .topbar .row{flex-wrap:nowrap}
  .topnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
  .topnav::-webkit-scrollbar{display:none}
  .topnav a{flex:none;padding:7px 14px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);text-decoration:none;font-size:.88rem;font-weight:500}
  .topnav a.on{background:var(--leaf);color:var(--leaf-ink)}
  main{padding-block:20px 48px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr);padding:24px 20px}
  .hero .mascot{display:none}
  .rep-hero{grid-template-columns:minmax(0,1fr);justify-items:start}
  .stage{min-height:460px;padding:20px}
  .lq .in{padding-left:18px}
  .qa>summary{grid-template-columns:auto minmax(0,1fr) auto}
  .qa>summary .score-pill{grid-column:3}
  .qa>summary .chev{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function applyTheme(){
  if(S.theme) document.documentElement.setAttribute('data-theme',S.theme); else document.documentElement.removeAttribute('data-theme');
  const dark = S.theme ? S.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.getElementById('themeBtn').innerHTML = (dark?I.sun:I.moon).replace('<svg','<svg width="16" height="16"') + (dark?'淺色模式':'深色模式');
  document.getElementById('themeBtn2').innerHTML = dark?I.sun:I.moon;
}
function toggleTheme(){
  const dark = S.theme ? S.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark?'light':'dark'; try{localStorage.setItem('hm-theme',S.theme)}catch(e){} applyTheme();

function ring(v,size=120,stroke=12,color='var(--leaf)',label=''){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v/100)}"/></svg><div class="c"><b style="font-size:${size/3.4}px">${v}</b><span class="faint">${label}</span></div></div>`;
}

function route(){

/* ---------- interview simulation ---------- */
let ivTimers=[];
function clearIv(){ivTimers.forEach(clearTimeout);ivTimers=[];clearInterval(S.iv._clock)}
function stopIv(){clearIv(); if(S.iv.phase==='live'){S.iv.phase='setup';S.iv.q=0;S.iv.log=[];S.iv.live=false;}}
function later(fn,ms){ivTimers.push(setTimeout(fn,ms))}
function typeInto(el,text,speed,done){
  let i=0; el.classList.add('typing');
  (function step(){ if(!el.isConnected) return; el.textContent=text.slice(0,++i); if(i<text.length) later(step,speed); else {el.classList.remove('typing'); done&&done();} })();
}
function addMsg(who,text,anim,done){
  const tb=document.getElementById('trBody'); if(!tb) return;
  const d=document.createElement('div'); d.className='msg '+who;
  d.innerHTML = who==='ai' ? `<div class="mascot mini">${mascot()}</div><div><div class="tag">Ava</div><div class="b"></div></div>` : `<div class="av mini" style="font-size:.8rem">妤</div><div style="display:flex;flex-direction:column;align-items:flex-end"><div class="tag">你</div><div class="b"></div></div>`;
  tb.appendChild(d); const b=d.querySelector('.b');
  if(anim) typeInto(b,text,anim,done); else {b.textContent=text; done&&done();}
  tb.scrollTop=tb.scrollHeight;
  const obs=setInterval(()=>{if(!b.isConnected)return clearInterval(obs);tb.scrollTop=tb.scrollHeight;if(!b.classList.contains('typing'))clearInterval(obs)},120);
  return b;
}
function setSpeaking(on){
  const h=document.getElementById('halo'), m=document.getElementById('bigMascot');
  if(h) h.classList.toggle('speaking',on); if(m) m.classList.toggle('talk',on);
}
function setMic(state){ // 'wait' | 'ready' | 'live'
  const mic=document.getElementById('mic'), hint=document.getElementById('micHint'); if(!mic) return;
  S.iv.live = state==='live';
  mic.disabled = state==='wait';
  mic.classList.toggle('live',state==='live');
  mic.innerHTML = state==='live'?I.stop:I.mic;
  mic.setAttribute('aria-label',state==='live'?'結束回答':'開始回答');
  ['waveL','waveR'].forEach(id=>document.getElementById(id).classList.toggle('live',state==='live'));
  hint.textContent = state==='wait'?'Ava 正在說話⋯':state==='ready'?'輪到你了，點麥克風開始回答':'正在聆聽⋯說完後再點一次';
}
const REACT=['謝謝你的分享，聽起來很有收穫。','很好，這個例子很具體！','了解，你處理得很細心。','好的，我們最後再聊一題。',''];
function askQuestion(){
  const iv=S.iv, q=QUESTIONS[iv.q], el=document.getElementById('qText'); if(!el) return;
  setMic('wait'); setSpeaking(true);
  const pre = iv.q===0?'你好，品妤！歡迎來到今天的面試。我們先從第一題開始：':'';
  typeInto(el,q.t,45,()=>{setSpeaking(false);setMic('ready')});
  addMsg('ai',pre+q.t,0);
}
function startAnswer(){
  const iv=S.iv; setMic('live');
  const ans=ANSWERS[iv.q]||'這題我想一下⋯我會先釐清需求，再提出幾個可行方案和取捨。';
  iv._ansEl=addMsg('me','',0); iv._ansEl.classList.add('typing');
  let i=0; const ansEl=iv._ansEl;
  (function step(){ if(!ansEl.isConnected||!S.iv.live) return; i=Math.min(ans.length,i+2+Math.floor(Math.random()*3)); ansEl.textContent=ans.slice(0,i); const tb=document.getElementById('trBody'); if(tb) tb.scrollTop=tb.scrollHeight; if(i<ans.length) later(step,70); else {ansEl.classList.remove('typing'); document.getElementById('micHint').textContent='說完了嗎？點麥克風送出回答';} })();
}
function finishAnswer(){
  const iv=S.iv; clearTimeoutsKeepClock();
  if(iv._ansEl){iv._ansEl.textContent=ANSWERS[iv.q]||iv._ansEl.textContent;iv._ansEl.classList.remove('typing')}
  nextQ(REACT[iv.q]||'');
}
function clearTimeoutsKeepClock(){ivTimers.forEach(clearTimeout);ivTimers=[]}
function nextQ(reaction){
  const iv=S.iv; setMic('wait');
  iv.q++;
  if(iv.q>=QUESTIONS.length){
    setSpeaking(true);
    const el=document.getElementById('qText');
    const bye='今天的面試到這裡結束，你表現得很棒！我正在幫你整理評分報告⋯';
    addMsg('ai',bye,0); typeInto(el,bye,40,()=>{setSpeaking(false); later(()=>{S.iv.phase='setup';S.iv.q=0;clearInterval(S.iv._clock);location.hash='#report';toast('評分報告完成了！')},900)});
    return;
  }
  if(reaction){addMsg('ai',reaction,0)}
  const keepClock=S.iv.timer; render(); S.iv.timer=keepClock; askQuestion();
}
function tickClock(){
  clearInterval(S.iv._clock);
  S.iv._clock=setInterval(()=>{S.iv.timer++;const t=document.getElementById('ivTime');if(t){const m=Math.floor(S.iv.timer/60),s=S.iv.timer%60;t.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}},1000);
}

/* re-render keeps transcript: store messages */
const _render=render;
render=function(){
  const tb=document.getElementById('trBody'); const saved=tb?tb.innerHTML:null;
  _render();
  if(cur==='interview'&&S.iv.phase==='live'&&saved!==null){const nb=document.getElementById('trBody');if(nb){nb.innerHTML=saved;nb.scrollTop=nb.scrollHeight}}
};

/* ---------- bindings ---------- */
function bind(){
  document.querySelectorAll('[data-job]').forEach(a=>a.addEventListener('click',()=>{S.job=a.dataset.job}));
  document.querySelectorAll('button.chip[data-cat]').forEach(b=>b.onclick=()=>b.classList.toggle('sel'));

  if(cur==='interview'){
    const iv=S.iv;
    if(iv.phase==='setup'){
      document.getElementById('ivJob').onchange=e=>{S.job=e.target.value;render()};
      document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{iv.mode=b.dataset.mode;render()});
      document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#langSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
      document.querySelectorAll('[data-persona]').forEach(b=>b.onclick=()=>{iv.persona=b.dataset.persona;render()});
      document.getElementById('ivStart').onclick=()=>{iv.phase='live';iv.q=0;iv.timer=0;_render();tickClock();later(askQuestion,500)};
    } else {
      document.getElementById('mic').onclick=()=>{ if(iv.live) finishAnswer(); else startAnswer(); };
      document.getElementById('skip').onclick=()=>{clearTimeoutsKeepClock(); if(iv._ansEl) iv._ansEl.classList.remove('typing'); addMsg('me','（跳過這題）',0); nextQ('沒關係，我們換下一題。')};
      document.getElementById('ivEnd').onclick=()=>{stopIv();location.hash='#report';toast('已結束面試，評分報告完成了！')};
    }
  }
  if(cur==='prep'){
    document.getElementById('prepJob').onchange=e=>{S.job=e.target.value;render()};
    document.getElementById('regen').onclick=()=>{toast('Ava 重新分析完成了');render()};
  }
  if(cur==='questions'){
    const qc=document.getElementById('qCount'); qc.oninput=()=>document.getElementById('qCountV').textContent=qc.value;
    document.querySelectorAll('#lvSeg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#lvSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
    document.getElementById('qJob').onchange=e=>{S.job=e.target.value};
    document.getElementById('genBtn').onclick=()=>{
      S.genLoading=true; render();
      setTimeout(()=>{S.genLoading=false;
        const extra=[{cat:'團隊合作',lv:'中等',t:'你會怎麼幫助一位剛加入的初階工程師快速上手？'},{cat:'系統設計',lv:'進階',t:'店家後台要支援 3,000 家店同時更新菜單，前端狀態要怎麼設計？'}];
        extra.forEach(x=>{if(!QUESTIONS.some(q=>q.t===x.t))QUESTIONS.push(x)});
        if(cur==='questions') render(); toast('新增了 2 題，已加到題組最後');},1400);
    };
    document.getElementById('addQ').onclick=()=>{QUESTIONS.push({cat:'自訂',lv:'中等',t:'',editing:true});render();const t=document.getElementById('qe'+(QUESTIONS.length-1));t&&t.focus()};
    document.querySelectorAll('.qcard [data-act]').forEach(b=>b.onclick=()=>{
      const i=+b.closest('.qcard').dataset.i, a=b.dataset.act, q=QUESTIONS[i];
      if(a==='up'&&i>0)[QUESTIONS[i-1],QUESTIONS[i]]=[QUESTIONS[i],QUESTIONS[i-1]];
      if(a==='down'&&i<QUESTIONS.length-1)[QUESTIONS[i+1],QUESTIONS[i]]=[QUESTIONS[i],QUESTIONS[i+1]];
      if(a==='edit')q.editing=true;
      if(a==='cancel'){q.editing=false;if(!q.t)QUESTIONS.splice(i,1)}
      if(a==='save'){const v=document.getElementById('qe'+i).value.trim();if(!v){toast('題目內容不能是空的');return}q.t=v;q.editing=false;toast('題目已儲存')}
      if(a==='del'){QUESTIONS.splice(i,1);toast('已刪除這一題')}
      render();
    });
  }
  if(cur==='jobs'){
    const go=()=>{JOBQ=document.getElementById('jq').value.trim();JOBLOC=document.getElementById('jloc').value;render()};
    document.getElementById('jgo').onclick=go;
    document.getElementById('jq').onkeydown=e=>{if(e.key==='Enter')go()};
    document.getElementById('jloc').onchange=go;
    document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{S.job=b.dataset.pick;render();if(innerWidth<1080)document.querySelector('.jd').scrollIntoView({behavior:'smooth'})});
    document.getElementById('saveJob').onclick=()=>toast('已收藏這個職缺');
  }
  if(cur==='profile'){
    const drop=document.getElementById('drop'), f=document.getElementById('cvFile');
    const take=file=>{if(!file)return;const kb=file.size/1024;CV={name:file.name,size:kb>1024?(kb/1024).toFixed(1)+' MB':Math.round(kb)+' KB',date:new Date().toLocaleDateString('zh-TW')};render();toast('履歷已上傳，Ava  正在解析內容')};
    f.onchange=()=>take(f.files[0]);
    ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
    drop.addEventListener('drop',e=>take(e.dataTransfer.files[0]));
    document.getElementById('cvDel').onclick=()=>toast('原型中先保留範例履歷');
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{SKILLS.splice(+b.dataset.rm,1);render()});
    const addSkill=()=>{const i=document.getElementById('skillIn');const v=i.value.trim();if(v&&!SKILLS.includes(v)){SKILLS.push(v);render();document.getElementById('skillIn').focus()}};
    document.getElementById('skillAdd').onclick=addSkill;
    document.getElementById('skillIn').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();addSkill()}};
    document.getElementById('saveProfile').onclick=()=>toast('個人檔案已儲存');
  }
}

document.querySelectorAll('[data-mascot]').forEach(m=>{m.classList.add('mascot');m.innerHTML=mascot()});
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
route();
</script>

</body></html>
