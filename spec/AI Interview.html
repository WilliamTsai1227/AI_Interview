<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Interview</title>
<style>
/* Layout: ChatGPT-style — collapsible left sidebar (nav, saved jobs, recent interviews, account), main column with a slim header and centered 768px content; empty state is a centered composer. Monochrome, light/dark. Sidebar becomes a drawer on phones. */
:root{
  color-scheme:light;
  --bg:#ffffff; --side:#f9f9f9; --surface:#f4f4f4; --surface-2:#e8e8e8; --hover:rgba(0,0,0,.05); --active:rgba(0,0,0,.08);
  --line:rgba(0,0,0,.09); --line-2:rgba(0,0,0,.16);
  --ink:#0d0d0d; --ink-2:#5d5d5d; --ink-3:#8f8f8f;
  --inv:#0d0d0d; --inv-ink:#ffffff; --code:#f9f9f9; --rec:#e02e2a; --mark:rgba(0,0,0,.08);
  --pop:#ffffff; --shadow:0 0 0 1px rgba(0,0,0,.06),0 6px 24px rgba(0,0,0,.08); --scrim:rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#212121; --side:#171717; --surface:#303030; --surface-2:#3c3c3c; --hover:rgba(255,255,255,.06); --active:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --ink:#ececec; --ink-2:#b4b4b4; --ink-3:#8f8f8f;
  --inv:#ececec; --inv-ink:#0d0d0d; --code:#171717; --rec:#ff5f57; --mark:rgba(255,255,255,.12);
  --pop:#353535; --shadow:0 0 0 1px rgba(255,255,255,.07),0 10px 30px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#212121; --side:#171717; --surface:#303030; --surface-2:#3c3c3c; --hover:rgba(255,255,255,.06); --active:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --ink:#ececec; --ink-2:#b4b4b4; --ink-3:#8f8f8f;
  --inv:#ececec; --inv-ink:#0d0d0d; --code:#171717; --rec:#ff5f57; --mark:rgba(255,255,255,.12);
  --pop:#353535; --shadow:0 0 0 1px rgba(255,255,255,.07),0 10px 30px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ink-3);outline-offset:2px;border-radius:8px}
svg{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--mark)}

/* ---------- shell ---------- */
.app{display:flex;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden}
.side{width:260px;flex:none;background:var(--side);display:flex;flex-direction:column;transition:margin-left .22s ease;border-right:1px solid var(--line);min-height:0}
.app.collapsed .side{margin-left:-260px}
.side-top{display:flex;align-items:center;gap:2px;padding:8px 8px 6px 10px;height:52px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:1rem;margin-right:auto;padding:4px 8px;border-radius:8px}
.brand:hover{background:var(--hover)}
.brand svg{width:22px;height:22px}
.ib{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);transition:background .12s,color .12s}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib svg{width:20px;height:20px}
.ib.sm{width:30px;height:30px}
.ib.sm svg{width:17px;height:17px}
.ib:disabled{opacity:.3;cursor:default;background:none}
.side-scroll{flex:1;overflow-y:auto;padding:4px 8px 12px;min-height:0}
.nav-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:.92rem;color:var(--ink);white-space:nowrap;overflow:hidden;width:100%;text-align:left;transition:background .12s}
.nav-i:hover{background:var(--hover)}
.nav-i.on{background:var(--active)}
.nav-i svg{width:18px;height:18px}
.nav-i .t{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.nav-i .r{font-size:.78rem;color:var(--ink-3);opacity:0;transition:opacity .12s}
.nav-i:hover .r{opacity:1}
.side-h{font-size:.78rem;color:var(--ink-3);padding:20px 10px 6px;font-weight:500}
.side-foot{padding:8px;border-top:1px solid var(--line)}
.me{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;width:100%;text-align:left}
.me:hover{background:var(--hover)}
.av{width:30px;height:30px;border-radius:50%;background:var(--inv);color:var(--inv-ink);display:grid;place-items:center;font-size:.8rem;font-weight:600;flex:none}
.me b{display:block;font-weight:500;font-size:.9rem;line-height:1.3}
.me small{display:block;color:var(--ink-3);font-size:.75rem;line-height:1.3}

.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.head{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px 0 10px}
.head .when-collapsed{display:none}
.app.collapsed .head .when-collapsed{display:grid}
.title{display:flex;align-items:center;gap:8px;font-size:1rem;font-weight:500;min-width:0;padding:4px 8px}
.title svg{width:18px;height:18px;color:var(--ink-2)}
.title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .badge{font-size:.72rem;color:var(--ink-2);background:var(--surface);padding:1px 8px;border-radius:999px;font-weight:500;flex:none}
.head .sp{flex:1}
.hbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;font-size:.88rem;color:var(--ink);transition:background .12s;white-space:nowrap}
.hbtn:hover{background:var(--hover)}
.hbtn svg{width:17px;height:17px}
.hbtn.line{border:1px solid var(--line-2)}
.view{flex:1;overflow-y:auto;min-height:0}
.wrap{max-width:768px;margin:0 auto;padding:24px 24px 96px}
.wrap.wide{max-width:960px}

/* ---------- buttons / atoms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;font-size:.9rem;font-weight:500;white-space:nowrap;transition:opacity .12s,background .12s}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--inv);color:var(--inv-ink)}
.btn.pri:hover{opacity:.85}
.btn.out{border:1px solid var(--line-2)}
.btn.out:hover,.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:32px;padding:0 12px;font-size:.84rem}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;font-size:.86rem;color:var(--ink);border:1px solid var(--line);transition:background .12s;white-space:nowrap;max-width:100%}
.pill:hover{background:var(--hover)}
.pill svg{width:15px;height:15px;color:var(--ink-2)}
.pill .lbl{overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3);font-size:.84rem}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar{height:4px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:9px}
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-12px);background:var(--inv);color:var(--inv-ink);padding:8px 16px;border-radius:999px;font-size:.88rem;opacity:0;pointer-events:none;transition:.2s;z-index:99;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- composer ---------- */
.composer{background:var(--surface);border-radius:28px;padding:12px 12px 10px 18px;box-shadow:0 0 0 1px var(--line);transition:box-shadow .15s}
.composer:focus-within{box-shadow:0 0 0 1px var(--line-2)}
.composer textarea{width:100%;border:0;background:transparent;outline:none;resize:none;min-height:28px;max-height:200px;line-height:1.6;font-size:1rem;padding:4px 0 8px;display:block}
.composer textarea::placeholder{color:var(--ink-3)}
.c-bar{display:flex;align-items:center;gap:4px;margin-left:-6px}
.c-bar .sp{flex:1}
.c-bar .pill{border-color:transparent}
.c-bar .pill{min-width:0;flex-shrink:1}
.send{width:36px;height:36px;border-radius:50%;background:var(--inv);color:var(--inv-ink);display:grid;place-items:center;transition:opacity .12s;flex:none}
.send:hover{opacity:.85}
.send:disabled{opacity:.25;cursor:default}
.send svg{width:18px;height:18px}

/* ---------- new interview (setup) ---------- */
.setup-wrap{max-width:680px;margin:0 auto;padding:7vh 24px 64px;display:flex;flex-direction:column;gap:22px}
.hello{text-align:center;font-size:clamp(1.55rem,1.2rem + 1.2vw,2rem);font-weight:600;letter-spacing:-.01em}
.hello+p{text-align:center;color:var(--ink-2);margin-top:-14px;font-size:.95rem}
.setup{border:1px solid var(--line-2);border-radius:20px;overflow:hidden}
.su-row{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line)}
.su-row .k{width:52px;flex:none;color:var(--ink-2);font-size:.9rem}
.su-row .v{flex:1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.su-row .hint{font-size:.8rem;color:var(--ink-3)}
.picker{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%;padding:6px 10px;margin-left:-10px;border-radius:10px;text-align:left;transition:background .12s}
.picker:hover{background:var(--hover)}
.picker b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;max-width:65%}
.picker span{color:var(--ink-3);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker svg{width:15px;height:15px;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:3px}
.seg button{padding:5px 14px;border-radius:999px;font-size:.86rem;color:var(--ink-2);white-space:nowrap;transition:background .12s,color .12s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--inv);color:var(--inv-ink)}
.qprev{padding:14px 18px 16px;background:var(--code)}
.qprev-h{display:flex;align-items:center;justify-content:space-between;font-size:.84rem;color:var(--ink-2);margin-bottom:8px}
.qprev-h a{color:var(--ink-2);display:inline-flex;align-items:center;gap:2px}
.qprev-h a:hover{color:var(--ink)}
.qprev ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.qprev li{display:flex;gap:12px;padding:7px 0;font-size:.92rem;line-height:1.55}
.qprev li .n{width:16px;flex:none;text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.qprev li .c{margin-left:auto;padding-left:12px;color:var(--ink-3);font-size:.78rem;white-space:nowrap}
.qprev li.auto{color:var(--ink-3)}
.start{display:flex;flex-direction:column;align-items:center;gap:12px}
.btn.xl{height:52px;padding:0 30px;font-size:1rem;gap:10px}
.btn.xl svg{width:20px;height:20px}
.start .faint{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.linkb{color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:6px}
.linkb:hover{color:var(--ink);background:var(--hover)}
.linkb svg{width:14px;height:14px}

.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px 12px 16px;border:1px solid var(--line-2);border-radius:16px;font-size:.92rem}
.banner .t{flex:1;min-width:180px}
.banner .t b{font-weight:500}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--rec);flex:none;animation:blink 1.4s infinite}
.nav-live{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:8px;border-radius:10px;border:1px solid var(--line-2);font-size:.88rem;width:100%}
.nav-live:hover{background:var(--hover)}
.nav-live .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:disabled{opacity:.3;cursor:default}
.btn.danger{color:var(--rec)}
.hrow .proc{font-size:.84rem;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}
.empty-note{padding:28px 12px;text-align:center;color:var(--ink-2)}
.empty-note .btn{margin-top:14px}

/* ---------- chat (interview) ---------- */
.chat{max-width:768px;margin:0 auto;padding:16px 24px 40px;display:flex;flex-direction:column;gap:28px}
.sysm{align-self:center;font-size:.8rem;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:4px 14px;text-align:center}
.m-ai{display:flex;flex-direction:column;gap:6px}
.m-ai .lab{font-size:.78rem;color:var(--ink-3);font-weight:500}
.m-ai .tx{font-size:1rem;line-height:1.75;white-space:pre-wrap}
.m-ai .acts{display:flex;gap:2px;margin-left:-6px}
.m-me{align-self:flex-end;max-width:78%;background:var(--surface);border-radius:20px;padding:10px 18px;line-height:1.7}
.m-me.skip{color:var(--ink-3)}
.cursor::after{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--ink);margin-left:4px;vertical-align:middle;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.rcard{display:flex;align-items:center;gap:14px;border:1px solid var(--line-2);border-radius:16px;padding:14px 16px;max-width:460px;transition:background .12s}
.rcard:hover{background:var(--hover)}
.rcard .ic{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;flex:none}
.rcard .ic svg{width:22px;height:22px}
.rcard b{display:block;font-weight:600}
.dock{flex:none;padding:0 24px 14px}
.dock-in{max-width:768px;margin:0 auto}
.prog{display:flex;gap:4px;margin:0 8px 10px}
.prog i{flex:1;height:3px;border-radius:3px;background:var(--surface-2)}
.prog i.d{background:var(--ink)}
.prog i.c{background:var(--ink-3)}
.vbar{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:28px;padding:10px 10px 10px 18px;min-height:60px;box-shadow:0 0 0 1px var(--line)}
.vbar .st{flex:1;min-width:0;display:flex;align-items:center;gap:12px;color:var(--ink-2);font-size:.95rem}
.vbar .btn.ghost{margin-left:-8px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink-2);animation:bounce 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.recdot{width:9px;height:9px;border-radius:50%;background:var(--rec);animation:blink 1.2s infinite;flex:none}
.wave{flex:1;display:flex;align-items:center;gap:3px;height:28px;min-width:40px;overflow:hidden}
.wave i{width:3px;flex:none;border-radius:2px;background:var(--ink);height:6px;animation:wv 1s ease-in-out infinite}
@keyframes wv{0%,100%{height:5px}50%{height:24px}}
.micbtn{width:40px;height:40px;border-radius:50%;background:var(--inv);color:var(--inv-ink);display:grid;place-items:center;transition:opacity .12s;flex:none}
.micbtn svg{width:19px;height:19px}
.micbtn:disabled{opacity:.25;cursor:default}
.micbtn:hover:not(:disabled){opacity:.85}

/* ---------- document pages ---------- */
.doc h1{font-size:1.75rem;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.doc h2{font-size:1.25rem;font-weight:600;margin:36px 0 14px}
.doc h3{font-size:1.05rem;font-weight:600}
.doc p{line-height:1.75}
.doc ul{margin:8px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;line-height:1.7}
.eyebrow{font-size:.84rem;color:var(--ink-3);margin-bottom:8px}
.big{display:flex;align-items:baseline;gap:10px;margin-top:20px;flex-wrap:wrap}
.big b{font-size:3.4rem;font-weight:600;letter-spacing:-.03em;line-height:1}
.big span{color:var(--ink-3)}
.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--ink-2);font-size:.84rem;background:var(--code)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;width:64px}
td .bar{min-width:100px}
blockquote{margin:12px 0;padding:2px 0 2px 16px;border-left:3px solid var(--line-2);color:var(--ink)}
mark{background:var(--mark);color:inherit;padding:1px 3px;border-radius:4px;font-weight:500}
.codebox{border-radius:12px;overflow:hidden;background:var(--code);border:1px solid var(--line);margin-top:14px}
.codebox .cb-h{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;font-size:.8rem;color:var(--ink-2);border-bottom:1px solid var(--line)}
.codebox .cb-h svg{width:15px;height:15px}
.codebox .cb-h .sp{flex:1}
.codebox .cb-b{padding:14px 16px;line-height:1.75;font-size:.95rem}
.qsec{padding:26px 0;border-bottom:1px solid var(--line)}
.qsec:last-of-type{border-bottom:0}
.qsec .qh{display:flex;align-items:baseline;gap:12px}
.qsec .qh h3{flex:1}
.qsec .sc{font-size:1.1rem;font-weight:600}
.sub-h{font-size:.84rem;font-weight:600;color:var(--ink-2);margin-top:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
details.acc{border-bottom:1px solid var(--line)}
details.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 4px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .t{flex:1;font-weight:500}
details.acc summary svg{width:18px;height:18px;color:var(--ink-3);transition:transform .2s}
details.acc[open] summary svg{transform:rotate(180deg)}
details.acc .bd{padding:0 4px 18px}
.tagx{font-size:.75rem;color:var(--ink-2);border:1px solid var(--line-2);padding:1px 8px;border-radius:999px;white-space:nowrap}
.chk{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-of-type{border-bottom:0}
.chk input{width:17px;height:17px;margin-top:4px;accent-color:var(--ink);flex:none}
.chk input:checked+span{color:var(--ink-3);text-decoration:line-through}
ul.ticks{list-style:none;padding:0}
ul.ticks li{display:flex;gap:10px}
ul.ticks li::before{content:"✓";font-weight:600;width:1em;flex:none;text-align:center}
ul.ticks.warn li::before{content:"!";font-weight:700}

/* report history list */
.grp-h{font-size:.78rem;color:var(--ink-3);font-weight:500;padding:22px 12px 6px}
.hrow{display:flex;align-items:center;gap:16px;padding:12px;border-radius:12px;transition:background .12s}
.hrow:hover{background:var(--hover)}
.hrow .bd{flex:1;min-width:0}
.hrow .bd b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .bd .m{display:block;font-size:.8rem;color:var(--ink-3);margin-top:2px}
.hrow .hs{display:flex;align-items:baseline;gap:6px;flex:none}
.hrow .hs b{font-size:1.35rem;font-weight:600;letter-spacing:-.02em}
.hrow .hs small{font-size:.76rem;color:var(--ink-3);min-width:26px}
.hrow .ch{color:var(--ink-3)}
.hrow .ch svg{width:16px;height:16px}

/* question bank */
.qrow{display:flex;align-items:flex-start;gap:14px;padding:14px 10px;border-radius:12px;transition:background .12s}
.qrow:hover{background:var(--hover)}
.qrow .no{width:22px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right;flex:none}
.qrow .bd{flex:1;min-width:0}
.qrow .qt{line-height:1.6}
.qrow .meta{font-size:.8rem;color:var(--ink-3);margin-top:2px}
.qrow .ops{display:flex;opacity:0;transition:opacity .12s}
.qrow:hover .ops,.qrow:focus-within .ops{opacity:1}
.qrow textarea{width:100%;border:1px solid var(--line-2);border-radius:12px;background:var(--bg);padding:10px 12px;outline:none;resize:vertical;line-height:1.6}
.qrow textarea:focus{border-color:var(--ink-3)}

let menuEl=null;
function closeMenu(){ if(menuEl){menuEl.remove();menuEl=null;document.removeEventListener('mousedown',outside,true);} }
function outside(e){ if(menuEl&&!menuEl.contains(e.target)) closeMenu(); }
function openMenu(anchor,items,onPick,dir='down'){
  closeMenu();
  const m=document.createElement('div'); m.className='menu'; m.setAttribute('role','menu');
  m.innerHTML=items.map((it,i)=>it.sep?'<hr>':it.title?`<div class="mh">${it.title}</div>`:it.header?`<div style="padding:8px 10px 6px"><div style="font-weight:500">${it.label}</div><div class="faint">${it.sub}</div></div>`:
    `<button type="button" role="menuitem" data-i="${i}">${it.icon?I[it.icon]:''}<span class="mt">${it.label}${it.sub?`<span class="ms">${it.sub}</span>`:''}</span>${it.checked!==undefined?`<span class="ck">${it.checked?I.check:''}</span>`:''}</button>`).join('');
  document.body.appendChild(m); menuEl=m;
  const r=anchor.getBoundingClientRect(), mw=m.offsetWidth, mh=m.offsetHeight;
  const left=Math.min(Math.max(8,r.left),innerWidth-mw-8);
  const top=(dir==='up'||r.bottom+mh+8>innerHeight)?r.top-mh-6:r.bottom+6;
  m.style.left=left+'px'; m.style.top=Math.max(8,top)+'px';
  m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.i]; closeMenu(); onPick(it.v,it);});
  setTimeout(()=>document.addEventListener('mousedown',outside,true));
}

}

/* ---------- page: interview (chat + voice bar) ---------- */
let timers=[], clock=null, ans=null;
const later=(f,ms)=>timers.push(setTimeout(f,ms));
function stopTimers(){timers.forEach(clearTimeout);timers=[];clearInterval(clock);clock=null;ans=null;}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function startClock(){ clearInterval(clock); clock=setInterval(()=>{ const iv=S.iv; if(!iv||iv.phase==='done'||iv.paused) return; iv.t++; const el=$('#ivT'); if(el) el.textContent=fmt(iv.t); },1000); }
function startInterview(){
  if(unfinished()) return askReplace();
  const j=job(S.job), n=MODES[S.mode].n;
  /* 題組不夠就自動補題，並寫回題組（不讓使用者卡在「題數不足」） */
  const base=qs().slice(0,n), fill=genericSet(j).filter(g=>!qs().some(q=>q.t===g.t)).slice(0,n-base.length);
  if(fill.length) qs().push(...fill);
  const list=[...base,...fill];
  S.iv={job:S.job,persona:S.persona,q:0,list,phase:'wait',t:0,answered:0,asked:-1,paused:false,
    msgs:[{r:'sys',text:`${j.co}・${j.title}・${MODES[S.mode].name} ${list.length} 題・${PERSONAS[S.persona].name}・${LANGS[S.lang]}`}]};
  if(location.hash==='#chat') render(); else location.hash='#chat';
  startClock(); later(()=>askQ(true),500);
}
function askReplace(){
  const iv=S.iv;
  const s=openModal(`<div class="mhead"><h2>你有一場暫停中的面試</h2><button class="ib" type="button" data-close aria-label="關閉">${I.x}</button></div>
    <div class="mbody"><p class="muted">${esc(job(iv.job).co)} 停在第 ${Math.min(iv.q+1,iv.list.length)} 題。一次只能進行一場面試，要先把它結束嗎？${iv.answered?`已回答的 ${iv.answered} 題會產生報告。`:''}</p>
    <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn out" type="button" id="mBack">回到那場面試</button><button class="btn pri" type="button" id="mNew">結束它，開始新的</button></div></div>`,'sm');
  s.querySelector('#mBack').onclick=()=>{closeModal();location.hash='#chat'};
  s.querySelector('#mNew').onclick=()=>{closeModal();endInterview(false);startInterview()};
}
function endInterview(go=true){
  const iv=S.iv; if(!iv) return null;
  discardLive(); stopTimers();
  const id=iv.answered>0?addHistory(iv):null;
  S.iv=null;
  if(go){ if(id){ location.hash='#report/'+id; toast('面試已結束，Ava 正在評分'); } else { if(S.route==='new') render(); else location.hash='#new'; toast('面試已結束，沒有回答的題目不會產生報告'); } }
  else renderSide();
  return id;
}
function confirmEnd(){
  const iv=S.iv; if(!iv) return;
  const s=openModal(`<div class="mhead"><h2>結束這場面試？</h2><button class="ib" type="button" data-close aria-label="關閉">${I.x}</button></div>
    <div class="mbody"><p class="muted">${iv.answered?`已回答的 ${iv.answered} 題會產生報告，還沒回答的 ${iv.list.length-iv.answered} 題不會評分。`:'你還沒有回答任何題目，結束後不會產生報告。'}</p>
    <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn out" type="button" data-close>繼續面試</button><button class="btn pri" type="button" id="mEnd">${iv.answered?'結束並產生報告':'結束面試'}</button></div></div>`,'sm');
  s.querySelector('[data-close].btn').onclick=closeModal;
  s.querySelector('#mEnd').onclick=()=>{closeModal();endInterview(true)};
}
/* 錄音中暫停、重錄或離開：丟掉這次還沒送出的回答 */
function discardLive(){
  const iv=S.iv; if(!iv||iv.phase!=='live') return;
  timers.forEach(clearTimeout); timers=[];
  if(ans){ ans.el.remove(); iv.msgs.pop(); ans=null; }
  iv.phase='ready';
}
function pauseIv(){
  const iv=S.iv; if(!iv||iv.phase==='done') return;
  discardLive(); timers.forEach(clearTimeout); timers=[];
  iv.paused=true; iv.phase=iv.asked===iv.q?'ready':'wait';
  render();
  const s=openModal(`<div class="mbody" style="text-align:center;padding:32px 24px 26px"><h2 style="font-size:1.2rem;font-weight:600">已暫停</h2>
    <p class="muted" style="margin-top:8px">計時已停止。可以先離開，24 小時內都能從「新面試」回來接著練。</p>
    <div class="row" style="justify-content:center;margin-top:20px"><button class="btn out" type="button" id="pLeave">先離開</button><button class="btn pri" type="button" id="pGo">繼續面試</button></div></div>`,'sm');
  s.querySelector('#pGo').onclick=()=>{closeModal();resumeIv()};
  s.querySelector('#pLeave').onclick=()=>{closeModal();location.hash='#new'};
}
function resumeIv(){
  const iv=S.iv; if(!iv) return;
  iv.paused=false; startClock();
  if(iv.asked!==iv.q) askQ(false); else setPhase('ready');
}
function leaveChat(){
  const iv=S.iv; if(!iv) return;
  if(iv.phase==='done'){ stopTimers(); S.iv=null; return; }
  const was=iv.paused;
  discardLive(); stopTimers();
  iv.paused=true; iv.phase=iv.asked===iv.q?'ready':'wait';
  if(!was) toast('面試已暫停，24 小時內都能回來繼續');
}
function pageChat(){
  const iv=S.iv, j=job(iv.job);
  setHead('chat',`${esc(j.co)} 模擬面試`,`${Math.min(iv.q+1,iv.list.length)} / ${iv.list.length}`,
    `<span class="faint num hide-m" style="display:inline-flex;align-items:center;gap:5px;margin-right:4px">${I.clock.replace('<svg','<svg width="14" height="14"')}<span id="ivT">${fmt(iv.t)}</span></span>
     ${iv.phase!=='done'?`<button class="hbtn" type="button" id="ivPause">${I.stop.replace('<rect x="7" y="7" width="10" height="10" rx="2"/>','<rect x="7" y="6" width="3.5" height="12" rx="1"/><rect x="13.5" y="6" width="3.5" height="12" rx="1"/>')}<span class="hide-m">暫停</span></button><button class="hbtn line" type="button" id="ivEnd">結束面試</button>`:''}`);
  return `<div class="chat" id="chat">${iv.msgs.map(msgHTML).join('')}</div>`;
}
function bindChat(){
  const e=$('#ivEnd'); if(e) e.onclick=confirmEnd;

}
function cardHTML(id){
  const h=HISTORY.find(x=>x.id===id); if(!h) return '';
  return `<a class="rcard" id="rc-${id}" href="#report/${id}"><span class="ic">${I.report}</span><span style="flex:1;min-width:0"><b>面試報告・${esc(job(h.job).co)}</b><span class="faint">${h.ready?`總分 ${h.s}・${h.n} 題逐題評分與改善建議`:'Ava 正在逐題評分，完成後會通知你'}</span></span>${h.ready?`<span style="color:var(--ink-3)">${I.right.replace('<svg','<svg width="18" height="18"')}</span>`:'<span class="dots"><i></i><i></i><i></i></span>'}</a>`;
}
function msgHTML(m){
  if(m.r==='sys') return `<div class="sysm">${esc(m.text)}</div>`;
  if(m.r==='me') return `<div class="m-me ${m.skip?'skip':''}">${esc(m.text)}</div>`;
  if(m.r==='card') return cardHTML(m.id);
  return `<div class="m-ai">${m.lab?`<div class="lab">${esc(m.lab)}</div>`:''}<div class="tx">${esc(m.text)}</div>${m.acts?`<div class="acts"><button class="ib sm" type="button" aria-label="重播這題" onclick="toast('重播 Ava 的語音')">${I.speak}</button><button class="ib sm" type="button" aria-label="複製題目" onclick="toast('已複製題目')">${I.copy}</button></div>`:''}</div>`;
}
function scrollEnd(){const v=$('#view'); v.scrollTop=v.scrollHeight;}
function pushMsg(m,speed,done){
  const iv=S.iv; iv.msgs.push(m);
  const box=$('#chat');
  if(!box){ done&&done(); return; }
  const tmp=document.createElement('div'); tmp.innerHTML=msgHTML(speed?{...m,text:'',acts:false}:m);
  const el=tmp.firstElementChild; box.appendChild(el); scrollEnd();
  if(!speed){ done&&done(); return; }
  const tx=el.querySelector('.tx'); const full=m.text; let i=0; tx.classList.add('cursor');
  (function step(){ if(!tx.isConnected||S.iv!==iv||iv.paused) return; i=Math.min(full.length,i+speed); tx.textContent=full.slice(0,i); scrollEnd();
    if(i<full.length) later(step,40);
    else { tx.classList.remove('cursor'); if(m.acts){const t2=document.createElement('div');t2.innerHTML=msgHTML(m);el.replaceWith(t2.firstElementChild);} done&&done(); } })();
}
function askQ(first){
  const iv=S.iv; if(!iv) return; const q=iv.list[iv.q]; iv.asked=iv.q; setPhase('wait'); updateProgress();
  const pre=first?`你好，${ME.short}！我是今天的面試官 Ava。我們開始吧。\n\n`:'';
  pushMsg({r:'ai',lab:`第 ${iv.q+1} 題・${q.cat}`,text:pre+q.t,acts:true},2,()=>setPhase('ready'));
}
function updateProgress(){const b=$('#hTitle .badge'); if(b&&S.iv) b.textContent=`${Math.min(S.iv.q+1,S.iv.list.length)} / ${S.iv.list.length}`; drawProg();}
function setPhase(p){ if(!S.iv) return; S.iv.phase=p; renderDock(); }
function drawProg(){const p=$('#prog'); if(p&&S.iv) p.innerHTML=S.iv.list.map((_,i)=>`<i class="${i<S.iv.q?'d':i===S.iv.q?'c':''}"></i>`).join('');}
function renderDock(){
  const d=$('#dock'), iv=S.iv;
  if(S.route!=='chat'||!iv){ d.hidden=true; d.innerHTML=''; return; }
  d.hidden=false;
  const p=iv.phase; let st='', btn='', left='';
  if(iv.paused&&p!=='done'){ st='已暫停・計時停止'; btn=`<button class="btn pri sm" type="button" id="vResume">繼續</button>`; }
  else if(p==='wait'){ st=`<span class="dots"><i></i><i></i><i></i></span>Ava 正在說話⋯`; btn=`<button class="micbtn" type="button" disabled aria-label="開始回答">${I.mic}</button>`; }
  else if(p==='ready'){ left=`<button class="btn ghost sm" type="button" id="vSkip">${I.next}跳過</button>`; st=`輪到你了，點麥克風開始回答`; btn=`<button class="micbtn" type="button" id="vMic" aria-label="開始回答">${I.mic}</button>`; }
  else if(p==='live'){ left=`<button class="btn ghost sm" type="button" id="vRedo">${I.redo}重錄</button>`; st=`<span class="recdot"></span><span class="num" id="aT">00:00</span><span class="wave" aria-hidden="true">${Array.from({length:48},(_,i)=>`<i style="animation-delay:${(i*137%1000)/1000}s"></i>`).join('')}</span>`; btn=`<button class="micbtn" type="button" id="vStop" aria-label="完成回答">${I.stop}</button>`; }
  else if(p==='done'){ const rh=iv.reportId&&HISTORY.find(x=>x.id===iv.reportId); st=rh?(rh.ready?'面試結束，報告完成了':'面試結束，Ava 正在評分'):'面試結束'; btn=iv.reportId?`<a class="btn pri sm" href="#report/${iv.reportId}">查看報告</a>`:`<a class="btn pri sm" href="#new">回到新面試</a>`; }
  const tip=iv.paused?'暫停期間不計時；24 小時內都能回來繼續。':p==='live'?'正在錄音，說完按 ■ 送出；想重講就按「重錄」。':'題目會依題組順序提問，每題回答都會錄音存檔。';
  d.innerHTML=`<div class="dock-in"><div class="prog" id="prog"></div><div class="vbar">${left}<div class="st">${st}</div>${btn}</div>
    <div class="faint" style="text-align:center;margin-top:8px;font-size:.75rem">${tip}</div></div>`;
  drawProg();
  const on=(sel,f)=>{const el=$(sel); if(el) el.onclick=f;};
  on('#vMic',startAnswer); on('#vStop',finishAnswer); on('#vSkip',skipQ); on('#vResume',()=>{resumeIv();render();});
  on('#vRedo',()=>{discardLive();setPhase('ready');toast('已清除這次錄音，重新回答吧')});
}
function startAnswer(){
  const iv=S.iv; setPhase('live');
  const full=ANSWERS[iv.q]||'這題我想一下⋯我會先釐清需求，再提出幾個可行方案和取捨。';
  const m={r:'me',text:full}; iv.msgs.push(m);
  const el=document.createElement('div'); el.className='m-me cursor'; $('#chat').appendChild(el); scrollEnd();
  let i=0, sec=0; ans={el,m,full};
  const tick=setInterval(()=>{ if(S.iv!==iv||iv.phase!=='live'||ans===null||ans.el!==el){clearInterval(tick);return} sec++; const a=$('#aT'); if(a) a.textContent=fmt(sec); },1000);
  (function step(){ if(!el.isConnected||iv.phase!=='live') return; i=Math.min(full.length,i+2+Math.floor(Math.random()*3)); el.textContent=full.slice(0,i); scrollEnd(); if(i<full.length) later(step,70); else el.classList.remove('cursor'); })();
}
const REACT=['謝謝你的分享，開場就有具體成果，很好。','了解，這個例子很具體。','嗯，你處理得很細心。','好的，我們來聊最後一題。'];
function finishAnswer(){
  const iv=S.iv; timers.forEach(clearTimeout); timers=[];
  if(ans){ans.el.textContent=ans.full;ans.el.classList.remove('cursor');ans=null}
  iv.answered++;
  next(REACT[iv.q]);
}
function skipQ(){
  const iv=S.iv; timers.forEach(clearTimeout); timers=[];

}
function next(reaction){
  const iv=S.iv; iv.q++; setPhase('wait');
  if(iv.q>=iv.list.length){
    updateProgress();
    const bye=iv.answered?'今天的面試到這裡結束，你表現得很棒！我會依你每一題的回答，整理評分和改善建議。':'今天的面試到這裡結束。這次沒有回答的題目，所以不會產生報告。';
    pushMsg({r:'ai',text:bye},2,()=>{ if(iv.answered){ iv.reportId=addHistory(iv); pushMsg({r:'card',id:iv.reportId}); } setPhase('done'); const h=$('#hRight'); if(h) render(); });
    return;
  }
  if(reaction) pushMsg({r:'ai',text:reaction},2,()=>later(()=>askQ(false),300));
  else askQ(false);

function bindJobGrid(){ $$('[data-job]').forEach(b=>b.onclick=()=>openJob(b.dataset.job)); }
function bindJobs(){
  const jq=$('#jq');
  jq.oninput=()=>{ S.jobQ=jq.value; $('#jgrid').innerHTML=jobsGrid(); bindJobGrid(); };
  $$('[data-tab]').forEach(b=>b.onclick=()=>{S.jobTab=b.dataset.tab;render()});
  bindJobGrid();
}
function openJob(id){
  const j=job(id); const saved=S.saved.has(id);
  const s=openModal(`<div class="mhead"><h2>職缺詳情</h2><button class="ib" type="button" data-close aria-label="關閉">${I.x}</button></div>
    <div class="mbody">
      <div style="text-align:center"><span class="lg" style="width:72px;height:72px;font-size:1.8rem;margin:0 auto;border-radius:20px">${j.logo}</span>
        <h2 style="font-size:1.4rem;font-weight:600;margin-top:14px">${esc(j.title)}</h2>
        <div class="muted" style="margin-top:2px">${esc(j.co)}・${j.loc}</div>
        <div class="row" style="justify-content:center;margin-top:12px"><span class="tagx">${j.match}% 契合</span><span class="tagx">${j.type}</span><span class="tagx">${j.pay}</span>${saved?'<span class="tagx">目標職缺</span>':''}</div>
      </div>
      <div class="doc" style="margin-top:22px">
        <p class="muted">${esc(j.about)}</p>
        <div class="sub-h">工作內容</div><ul>${j.duties.map(d=>`<li>${d}</li>`).join('')}</ul>
        <div class="sub-h">條件要求</div><ul>${j.req.map(d=>`<li>${d}</li>`).join('')}</ul>
        <div class="row" style="margin-top:14px">${j.tags.map(t=>`<span class="tagx">${t}</span>`).join('')}</div>
      </div>
      <div class="row" style="margin-top:24px;justify-content:center">
        <button class="btn pri" type="button" id="mGo">${I.mic}練習這個職缺</button>
        <button class="btn out" type="button" id="mSet">${I.book}題組</button>
        <button class="btn out" type="button" id="mPrep">${I.bulb}面試建議</button>
      </div>
      ${saved?`<div style="text-align:center;margin-top:14px"><button class="linkb" type="button" id="mRm">移出目標職缺</button></div>`:`<p class="faint" style="text-align:center;margin-top:14px">練習後會自動加入目標職缺，Ava 會先幫你出好題目。</p>`}
    </div>`,'sm');
  const go=hash=>{ S.job=id; addTarget(id); closeModal(); if(location.hash===hash) render(); else location.hash=hash; };
  s.querySelector('#mGo').onclick=()=>go('#new');
  s.querySelector('#mSet').onclick=()=>go('#questions/'+id);
  s.querySelector('#mPrep').onclick=()=>go('#prep');
  const rm=s.querySelector('#mRm'); if(rm) rm.onclick=()=>{ S.saved.delete(id); toast('已移出目標職缺，題組會保留，重新加入就能找回'); closeModal(); render(); };
}

/* ---------- settings modal (general / resume / goals / account) ---------- */
function openSettings(tab='general'){
  if(tab==='profile') tab='account';
  const tabs=[['general','一般','gear'],['resume','履歷','file'],['goal','求職意向','target'],['account','帳號','user']];
  const body={
    general:`<div class="srow"><span>主題</span><select class="selx" id="stTheme"><option value="">跟隨系統</option><option value="dark" ${S.theme==='dark'?'selected':''}>深色</option><option value="light" ${S.theme==='light'?'selected':''}>淺色</option></select></div>
      <div class="srow"><span>預設面試長度</span><select class="selx" id="stMode">${Object.entries(MODES).map(([k,m])=>`<option value="${k}" ${S.mode===k?'selected':''}>${m.name} ${m.n} 題</option>`).join('')}</select></div>
      <div class="srow"><span>預設面試語言</span><select class="selx" id="stLang">${Object.entries(LANGS).map(([k,n])=>`<option value="${k}" ${S.lang===k?'selected':''}>${n}</option>`).join('')}</select></div>
      <div class="srow"><span>預設面試官風格</span><select class="selx" id="stPer">${Object.entries(PERSONAS).map(([k,p])=>`<option value="${k}" ${S.persona===k?'selected':''}>${p.name}</option>`).join('')}</select></div>
      <div class="srow"><span>回答錄音保留</span><span class="sv">180 天（逐字稿與評分會保留）</span></div>`,
    resume:`<p class="faint" style="padding-top:12px">Ava 依履歷內容出題和評分，不需要另外填寫經歷或技能。</p>
      <div class="srow col" style="border:0">
        ${S.hasCv?RESUMES.map((r,i)=>`<div class="file"><span class="fi">${I.file}</span><span style="flex:1;min-width:0"><span style="font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i===0?S.cv.name:r)}</span><span class="faint">${i===0?`${S.cv.size}・${S.cv.date}・主要履歷`:'412 KB・2026/09/10'}・AI 已解析</span></span>${i?`<button class="btn ghost sm" type="button" onclick="toast('已設為主要履歷')">設為主要</button>`:''}<button class="ib sm" type="button" aria-label="刪除履歷" onclick="toast('原型中先保留範例履歷')">${I.trash}</button></div>`).join(''):''}
        <label class="drop" id="drop" for="cvFile">${I.upload}<span style="font-weight:500">拖曳檔案到這裡，或點擊上傳</span><span class="faint">PDF、Word，10 MB 以內</span><input type="file" id="cvFile" accept=".pdf,.doc,.docx" hidden></label></div>
      ${S.hasCv?`<div class="doc"><div class="sub-h">Ava 從履歷讀到的</div>
        <div class="row" style="margin-top:8px">${S.skills.map(s=>`<span class="tagx">${esc(s)}</span>`).join('')}</div>
        <ul style="margin-top:10px"><li>前端工程師・Shoply Taiwan（2023/12 – 現在）</li><li>前端實習生・Cubic Interactive（2023/02 – 2023/08）</li></ul>
        <div class="grid2" style="margin-top:4px"><div><div class="sub-h">履歷亮點</div><ul class="ticks"><li>成果有量化數字</li><li>技能和職缺需求相符</li></ul></div>
        <div><div class="sub-h">可以更好</div><ul class="ticks warn"><li>補上帶人或 mentor 經驗</li><li>專案描述加上你的角色</li></ul></div></div>
        <p class="faint" style="margin-top:12px">讀錯了嗎？直接修改履歷檔案後重新上傳就好。</p></div>`:''}`,
    goal:`<p class="faint" style="padding-top:12px">選填。只用來在「職缺」頁推薦適合你的職缺。</p>
      <div class="srow col"><span>想找的職位</span><input class="inp" value="資深前端工程師、UI 工程師" aria-label="想找的職位"></div>
      <div class="srow col"><span>希望地點</span><input class="inp" value="台北市、新北市、可遠端" aria-label="希望地點"></div>
      <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn pri sm" type="button" onclick="toast('已儲存')">儲存</button></div>`,
    account:`<div class="srow col"><span>名稱</span><input class="inp" value="陳品妤" aria-label="名稱"></div>
      <div class="srow"><span>Email</span><span class="sv">pinyu.chen@example.com</span></div>
      <div class="srow"><span>方案</span><span class="sv">Plus・本月剩 18 場</span></div>
      <div class="srow"><span>刪除所有面試紀錄與錄音</span><button class="btn out sm danger" type="button" onclick="toast('原型中不會真的刪除')">全部刪除</button></div>
      <div class="srow"><span>刪除帳號</span><button class="btn out sm danger" type="button" onclick="toast('原型中不會真的刪除')">刪除帳號</button></div>`
  };
  const s=openModal(`<div class="mhead"><h2>設定</h2><button class="ib" type="button" data-close aria-label="關閉">${I.x}</button></div>
    <div class="set"><nav class="set-tabs">${tabs.map(([k,n,ic])=>`<button type="button" class="${tab===k?'on':''}" data-st="${k}">${I[ic]}${n}</button>`).join('')}</nav><div class="set-body">${body[tab]}</div></div>`);
  s.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>openSettings(b.dataset.st));
  const sel=(id,f)=>{const el=s.querySelector(id); if(el) el.onchange=()=>{f(el.value); if(S.route==='new') render();};};
  sel('#stTheme',v=>setTheme(v||null)); sel('#stMode',v=>S.mode=v); sel('#stLang',v=>S.lang=v); sel('#stPer',v=>S.persona=v);
  const f=s.querySelector('#cvFile'), drop=s.querySelector('#drop');
  if(f){
    const take=file=>{ if(!file) return; const kb=file.size/1024; S.cv={name:file.name,size:kb>1024?(kb/1024).toFixed(1)+' MB':Math.round(kb)+' KB',date:new Date().toLocaleDateString('zh-TW')}; S.hasCv=true; openSettings('resume'); if(S.route==='new') render(); toast('履歷已上傳，Ava 正在解析'); };
    f.onchange=()=>take(f.files[0]);
    ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
    drop.addEventListener('drop',e=>take(e.dataTransfer.files[0]));
  }
}

/* ---------- search modal ---------- */
function openSearch(){
  closeDrawer();
  const s=openModal(`<div class="mhead" style="padding:8px 12px 8px 18px"><span style="color:var(--ink-3)">${I.search.replace('<svg','<svg width="18" height="18"')}</span><input id="sq" class="inp" style="border:0;padding:6px 4px;font-size:1rem" placeholder="搜尋面試紀錄、職缺、題目⋯" aria-label="搜尋"><button class="ib" type="button" data-close aria-label="關閉">${I.x}</button></div><div class="mbody" id="sres" style="padding:8px"></div>`,'sm');
  const draw=q=>{ q=q.toLowerCase();
    const a=[...HISTORY.map(h=>({ic:'report',t:h.t,r:h.s+' 分',href:'#report/'+h.id})),...JOBS.map(j=>({ic:'brief',t:j.co+'・'+j.title,r:j.match+'%',job:j.id})),...qs().map(x=>({ic:'book',t:x.t,r:x.cat,href:'#questions/'+S.job}))].filter(x=>!q||x.t.toLowerCase().includes(q)).slice(0,10);
    $('#sres').innerHTML=a.length?a.map((x,i)=>`<button class="sres" type="button" data-k="${i}">${I[x.ic]}<span class="t">${esc(x.t)}</span><span class="faint">${x.r}</span></button>`).join(''):`<p class="faint" style="padding:16px">找不到結果</p>`;
    $$('#sres [data-k]').forEach(b=>b.onclick=()=>{const x=a[+b.dataset.k]; closeModal(); if(x.job) openJob(x.job); else location.hash=x.href; });
  };
  const inp=s.querySelector('#sq'); inp.oninput=()=>draw(inp.value); draw(''); inp.focus();
}

/* ---------- router ---------- */
const PAGES={new:[pageNew,bindNew],chat:[pageChat,bindChat],report:[pageReport,bindReport],prep:[pagePrep,bindPrep],questions:[pageQuestions,bindQuestions],jobs:[pageJobs,bindJobs]};
function render(){
  closeMenu();
  const [page,bind]=PAGES[S.route];
  $('#view').innerHTML=page(); bind(); renderSide(); renderDock();
}
function route(){
  const [h,arg]=(location.hash||'#new').slice(1).split('/');
  let next=PAGES[h]?h:'new';
  S.reportId=next==='report'?(arg||null):null;
  S.qJob=next==='questions'&&arg&&JOBS.some(x=>x.id===arg)?arg:null;
  if(S.qJob) S.job=S.qJob;
  if(next!=='report') S.histQ='';
  if(S.route==='chat'&&next!=='chat') leaveChat();
  if(next==='chat'&&!S.iv){ history.replaceState(null,'','#new'); next='new'; }
  const resuming=next==='chat'&&S.route!=='chat'&&S.iv&&S.iv.paused&&S.iv.phase!=='done';
  S.route=next; closeModal(); closeDrawer(); render(); if(next!=='chat') $('#view').scrollTop=0;
  if(resuming){ pushMsg({r:'sys',text:`已回到面試・從第 ${Math.min(S.iv.q+1,S.iv.list.length)} 題繼續`}); resumeIv(); }
}
window.addEventListener('hashchange',route);
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
route();
</script>
